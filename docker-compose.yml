version: '3.9'

networks:
  sgc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  nginx_certs:

services:
  # ============================================================
  # PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: sgc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgcunt}
      POSTGRES_USER: ${POSTGRES_USER:-sgc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgc_secure_pass_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_PE.UTF-8 --lc-ctype=es_PE.UTF-8"
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      sgc-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgc_user} -d ${POSTGRES_DB:-sgcunt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sgc-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_2024}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      sgc-network:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO (S3-Compatible)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: sgc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgc_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_2024}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      sgc-network:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Inicializar buckets MinIO
  minio-init:
    image: minio/mc:latest
    container_name: sgc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgc_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_2024}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set sgcminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing sgcminio/sgc-documentos;
      mc mb --ignore-existing sgcminio/sgc-evidencias;
      mc anonymous set download sgcminio/sgc-documentos;
      echo 'Buckets creados exitosamente';
      "
    networks:
      - sgc-network

  # ============================================================
  # Backend Node.js
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sgc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      # Base de datos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sgcunt}
      DB_USER: ${POSTGRES_USER:-sgc_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sgc_secure_pass_2024}
      DB_SCHEMA: sgc
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_2024}
      REDIS_DB: 0
      # JWT
      JWT_SECRET: ${JWT_SECRET:-jwt_super_secret_sgc_unt_2024_change_in_prod}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_super_secret_sgc_unt_2024}
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sgc_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secure_2024}
      MINIO_BUCKET_DOCS: sgc-documentos
      MINIO_BUCKET_EVIDENCIAS: sgc-evidencias
      MINIO_URL_EXPIRY: 3600
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-sgc@unitru.edu.pe}
      SMTP_PASS: ${SMTP_PASS:-smtp_password}
      SMTP_FROM: ${SMTP_FROM:-"SGC-UNT <sgc@unitru.edu.pe>"}
      # n8n
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      N8N_API_KEY: ${N8N_API_KEY:-n8n_api_key_2024}
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8080,https://localhost:8443}
      # HMAC para tokens recuperación
      HMAC_SECRET: ${HMAC_SECRET:-hmac_secret_recovery_2024}
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10
      # Bcrypt
      BCRYPT_SALT_ROUNDS: 12
      # Bloqueo de cuenta
      MAX_LOGIN_ATTEMPTS: 5
      ACCOUNT_LOCK_DURATION: 900
      TZ: America/Lima
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      sgc-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Frontend Next.js
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: SGC-UNT
        NEXT_PUBLIC_APP_VERSION: 2.0.0
    container_name: sgc-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      TZ: America/Lima
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      sgc-network:
        ipv4_address: 172.20.0.21
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # n8n
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: sgc-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_USER:-sgc_n8n}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-n8n_secure_2024}
      N8N_HOST: ${N8N_HOST:-n8n}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-sgcunt}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-sgc_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-sgc_secure_pass_2024}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-n8n_encryption_key_2024_sgc}
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SGC_API_URL: http://backend:3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SMTP_FROM: ${SMTP_FROM:-"SGC-UNT <sgc@unitru.edu.pe>"}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      sgc-network:
        ipv4_address: 172.20.0.30

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: sgc-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
      - ./nginx/generate-certs.sh:/docker-entrypoint.d/10-generate-certs.sh
    depends_on:
      - backend
      - frontend
    networks:
      sgc-network:
        ipv4_address: 172.20.0.40
